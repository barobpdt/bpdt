<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ACE Emmet demo</title>
  <style type="text/css" media="screen">
    body {
        overflow: hidden;
    }
    #editor { 
        margin: 0;
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        right: 0;
    }
  </style>
</head>
<body>

<pre id="editor"></pre>
<script src="/assets/js/jquery.js" type="text/javascript"></script>
<script src="/assets/js/common.js" type="text/javascript"></script>
<script src="/assets/js/require.js" type="text/javascript"></script>
<script>
// setup paths
	var paths = {ace: "src"} 		// , "":"ext/emmet"
	require.config({baseUrl:"/assets/ace", paths: paths });
	require(["ace/ace"], ace => e=ace.edit('editor'))
</script>
</body>
</html>
