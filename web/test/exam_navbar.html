<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nav Bar | Barmajli</title>
    <style>
        :root {
			--color-primary: #132821;
			--color-accent: #1B5B46;
			--color-dark-green: #1D3F31;
			--color-medium-green: #4C896C;
			--color-light-green: #e2f0e7;
		}

		*{
			margin: 0;
			padding: 0;
			font-family: sans-serif;
			list-style: none;
			text-decoration: none;
			color: var(--color-light-green);
			box-sizing: border-box;
		}

		body{
			height: 100vh;
			width: 100vw;
			overflow: hidden;
			background: #aaa;
		}

		img{
			display: none;
			width: 40px;
			height: 40px;
			cursor: pointer;
		}
		.container{
			display: flex;
			flex-direction: column;
			justify-content: center;
			background-image: url(../assets/images/background-test.png);
			height: 100%;
			width: 100%;
			background-position: center;
			background-size: cover;
			background-repeat: no-repeat;
		}
		nav{
			display: flex;
			justify-content: space-between;
			align-items: center;
			width: 75%;
			margin: auto;
			padding: 10px 0;
		}
		nav h1{
			font-size: 2.5rem;
			font-weight: bold;
			letter-spacing: 2px;
			cursor: pointer;
		}

		nav ul{
			display: flex;
			align-items: center;
			gap: 2rem;
		}
		nav ul li{
			height: 30px;
			display: flex;
			align-items: center;
			overflow: hidden;
		}

		nav ul li a{
			font-size: 20px;
			cursor: pointer;
			position: relative;
		}
		nav ul li a:hover{
			color: var(--color-medium-green);
		}
		nav ul li a::before{
			content: "";
			background: var(--color-medium-green);
			width: 50%;
			height: 3px;
			position: absolute;
			top: 22px;
			left: -50%;
			transition: all 400ms ease;
			-webkit-transition: all 400ms ease;
			-moz-transition: all 400ms ease;
			-ms-transition: all 400ms ease;
			-o-transition: all 400ms ease;
		}


		nav ul li a:hover::before{
			left: 0;
		}

		@media screen and (max-width: 995px) {
			img{
				display: block;
			}
			nav{
				width: 90%;
			}
			nav ul{
				position: absolute;
				flex-direction: column;
				align-items: flex-start;
				right: -100%;
				top: 0;
				width: 50%;
				background: #1b5b4691;
				backdrop-filter: blur(16px);
				height: 100%;
				padding: 10rem 0 0 4rem;
				transition: all 0.4s ease;
				-webkit-transition: all 0.4s ease;
				-moz-transition: all 0.4s ease;
				-ms-transition: all 0.4s ease;
				-o-transition: all 0.4s ease;
		}
			nav.active ul{
				right: 0;
			}
			img.close{
				position: absolute;
				top: 0.8rem;
				right: 3rem;
			}
			nav ul li a:hover{
				color: var(--color-dark-green);
			}
			nav ul li a::before{
				background: var(--color-dark-green);
			}
		}
		@media screen and (max-width: 428px) {
			img.close{
				right: 1.5rem;
			}
			nav ul{
				width: 70%;
				padding: 5rem 0 0 2rem;
			}
		}
		.test:before {
			content: attr(data-before);
		}
    </style>
	<script src="/assets/js/jquery.js"></script>
</head>
<body>

    <div class="container">
        <nav>
            <h1>Brand</h1>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Services</a></li>
                <li><a href="#">Projects</a></li>
                <li><a href="#">Contact</a></li>
                <img src="/assets/icons/close.png" alt="" class="close">
            </ul>
            <img src="/assets/icons/menu.png" alt="" class="menu">
        </nav>
		<div style="flex:1;">
			<div class="test">test</div>

		</div>
    </div>

    <script>
		const toggle = document.querySelectorAll('img');
		const nav = document.querySelector('nav');


		toggle.forEach(btn =>{
			btn.addEventListener('click', ()=>{
				nav.className = nav.className == "active" ? "": "active"; 
			})
		})


		// document.styleSheets[0].addRule('.test:before', 'content: attr(data-before);');
		$('.test').on('click', function(){
			// alert($(this).attr('data-before'));
			$(this).attr('data-before', 'Hello World!');
		});
		
	</script>
</body>
</html>
