<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
  <link rel="shortcut icon" type="image/ico" href="favicon.ico" />
  <title>레이아웃 테스트</title> 
  <link rel="stylesheet" href="/assets/css/vicon.css" type="text/css"/>
  <script src="/assets/js/jquery.js"></script>
  <script src="/assets/js/apps.js"></script> 
</head>
<body style="margin:0;padding:0;box-sizing: border-box;"> 
	<div id="apps" style="border:1px solid #aaa;width:100%; height:100vh;box-sizing: border-box;"></div>
	
<script>
	const initDevPage = app => {
		const ws = cf.websocket
		if( ws ) {
			ws.connectWebSocket()
			ws.setCallbackFunc((type,data) => {
				clog('@@ websocket callback ', type, data)
				switch(type) {
				case 'changePageScript':
					clog('@ changePageScript app => ', app)
					app.loadPage(data.pageCode)
					return true
				default:
				}
			})
		}
		clog('init page =>', ws, app)
		app.loadPage('test')
		window.addEventListener('beforeunload', () => {
			if (cf.timerIdx) {
				clearInterval(cf.timerIdx)
			}
			if (cf.inertvalIdx) {
				clearInterval(cf.timerIdx)
			}
		});
	}
	const setPageInterval = (fc, delay) => {
		if(!delay) delay=1000
		cf.inertvalIdx = setInterval(fc,delay)
	}
	$(document).ready(()=>{ 
		cf.apps = new Apps('apps')
		const layout = {
			tag:'div'
			, children:[
				{tag:'div',style:{flex:1}, className:'appContents', content:true}
			]
		}
		const appInfo = {name:'개발페이지', background:'#aaa', layout} 
		const app = cf.apps.createApp('dev', appInfo, app=>initDevPage(app))
	})
	 
</script>
</body>
</html>
