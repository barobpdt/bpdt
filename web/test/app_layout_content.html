<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
  <link rel="shortcut icon" type="image/ico" href="favicon.ico" />
  <title>레이아웃 테스트</title>
  <!--
  <link rel="stylesheet" href="/assets/css/styles.css" type="text/css"/>
  -->
  <script src="/assets/js/jquery.js"></script>
  <script src="/assets/js/apps.js"></script> 
</head>
<body style="margin:0;padding:0;box-sizing: border-box;"> 
	<div id="apps" style="border:1px solid #aaa;width:100%; height:100vh;box-sizing: border-box;"></div>
	
<script>
 
	$(document).ready(()=>{ 
		cf.apps = new Apps('apps')
		const layout = {
			tag:'div'
			, children:[
				{tag:'div',style:getCss('full',{height:30,background:getRandomColor()}), className:'appTop'},
				{tag:'div',style:{flex:1}, className:'appContents', content:true},
				{tag:'div',style:{height:30,background:getRandomColor()}, className:'appFooter'},
			]
		}
		const appInfo = {name:'개발페이지', background:'#aaa', layout} 
		const app = cf.apps.createApp('dev', appInfo, app=>app.loadPage('main'))
		
	})
	 
</script>
</body>
</html>
