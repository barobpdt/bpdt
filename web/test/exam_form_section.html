<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>3D Button</title>

	<link rel="styleSheet" href="/assets/css/form_section.css"/>
	<link
	href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap"
	rel="stylesheet"
	/>
	<style>
	body {
		width: 100%;
		height: 100vh;
		margin: 0;
		padding: 0;
	}
	.container {
		width: 100%;
		height: 100%;
		background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
		display: flex;
		flex-direction: column;
		align-items: center;		
		color: white;
		overflow: auto;
	}  
	.frm-test { 
        background: linear-gradient(
          135deg,
          rgb(189, 195, 199),
          rgb(149, 165, 166),
          rgb(189, 195, 199)
        ); 
        box-sizing: border-box;
        padding: 25px; 
        border-radius: 3mm 3mm 0 0;
	}

	.particles {
        position: absolute;
        top: 0;
        left: 0;
        width: 400px;
        height: 400px;
        transform-style: preserve-3d;
        transform-origin: center;
        perspective: 600px;
        transform: rotate(0);
        animation: colors 6s infinite;
      }
      .particles:nth-child(even) {
        transform: rotate(180deg);
      }
      @keyframes colors {
        to {
          filter: hue-rotate(360deg);
        }
      }
      .particle {
        position: absolute;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        top: 185px;
        left: 185px;
        animation: move 3s infinite;
      }
      @keyframes move {
        100% {
          transform: translate3d(0, 0, -1000px);
        }
      }
      .particle:nth-child(1) {
        background: rgb(255, 222, 81);
        box-shadow: rgba(72, 135, 202, 0.8) 0 0 90px 33px;
        transform: translate3d(0px, 0px, 1685px);
        animation-delay: calc(var(--delay) - 0.3s);
      }
      .particle:nth-child(2) {
        background: rgb(94, 99, 254);
        transform: translate3d(38px, 40px, 1400px);
        animation-delay: calc(var(--delay) - 0.8s);
      }
      .particle:nth-child(3) {
        background: rgb(255, 107, 108);
        transform: translate3d(-116px, 104px, 723px);
        animation-delay: calc(var(--delay) - 0.5s);
      }
      .particle:nth-child(4) {
        background: white;
        transform: translate3d(-200px, -100px, 1200px);
        animation-delay: calc(var(--delay) - 0.2s);
      }
      .particle:nth-child(5) {
        background: rgb(77, 170, 87);
        transform: translate3d(380px, -344px, 1305px);
        animation-delay: calc(var(--delay) - 1.2s);
      }
      .particle:nth-child(6) {
        background: rgb(229, 240, 85);
        transform: translate3d(241px, 125px, 684px);
        animation-delay: calc(var(--delay) - 0.8s);
      }
      .particle:nth-child(7) {
        background: rgb(254, 76, 136);
        transform: translate3d(-50px, 400px, 300px);
        animation-delay: calc(var(--delay) - 1s);
      }
      .particle:nth-child(8) {
        background: rgb(107, 228, 255);
        transform: translate3d(380px, -400px, 2100px);
        animation-delay: calc(var(--delay) - 3.5s);
      }
      .particle:nth-child(9) {
        background: rgb(192, 173, 248);
        transform: translate3d(200px, 1000px, 600px);
        animation-delay: calc(var(--delay) - 2.2s);
      }
      .particle:nth-child(10) {
        background: rgb(217, 231, 203);
        transform: translate3d(-50px, 400px, 300px);
        animation-delay: calc(var(--delay) - 1.5s);
      }
	</style>
	<script src="/assets/js/jquery.js"></script>
	<script src="/assets/js/common.js"></script>
</head>
<body>
	<div class="container">
		<div style="overflow: hidden;width:100%;height:100%;display: none;">
			<div class="particles" style="--delay: 0s">
			<div class="particle"></div>
			<div class="particle"></div>
			<div class="particle"></div>
			<div class="particle"></div>
			<div class="particle"></div>
			<div class="particle"></div>
			<div class="particle"></div>
			<div class="particle"></div>
			<div class="particle"></div>
			<div class="particle"></div>
			</div>
			<div class="particles" style="--delay: 2.3s">
			<div class="particle"></div>
			<div class="particle"></div>
			<div class="particle"></div>
			<div class="particle"></div>
			<div class="particle"></div>
			<div class="particle"></div>
			<div class="particle"></div>
			<div class="particle"></div>
			<div class="particle"></div>
			<div class="particle"></div>
			</div>
			<div class="particles" style="--delay: 3.5s">
			<div class="particle"></div>
			<div class="particle"></div>
			<div class="particle"></div>
			<div class="particle"></div>
			<div class="particle"></div>
			<div class="particle"></div>
			<div class="particle"></div>
			<div class="particle"></div>
			<div class="particle"></div>
			<div class="particle"></div>
			</div>
			<div class="particles" style="--delay: 2.8s">
			<div class="particle"></div>
			<div class="particle"></div>
			<div class="particle"></div>
			<div class="particle"></div>
			<div class="particle"></div>
			<div class="particle"></div>
			<div class="particle"></div>
			<div class="particle"></div>
			<div class="particle"></div>
			<div class="particle"></div>
			</div>
			<div class="particles" style="--delay: 5s">
			<div class="particle"></div>
			<div class="particle"></div>
			<div class="particle"></div>
			<div class="particle"></div>
			<div class="particle"></div>
			<div class="particle"></div>
			<div class="particle"></div>
			<div class="particle"></div>
			<div class="particle"></div>
			<div class="particle"></div>
			</div>
			<div class="particles" style="--delay: 4.3s">
			<div class="particle"></div>
			<div class="particle"></div>
			<div class="particle"></div>
			<div class="particle"></div>
			<div class="particle"></div>
			<div class="particle"></div>
			<div class="particle"></div>
			<div class="particle"></div>
			<div class="particle"></div>
			<div class="particle"></div>
			</div>

		</div>
		<div class="frm-test" style="width: calc(100% - 50px);margin-top: 50px;">
			<section class="form_section">
				<h2>Button</h2>
				<div class="form_row">
					<div class="state-group">
						<button class="btn primary" tabindex="0">Label</button>
						<button class="btn icon-btn" tabindex="0">
							<span class="icon">▼</span>
						</button>
						<div class="btn-group" role="group" aria-label="Label options">
							<button class="label" type="button">Label</button>
							<button class="caret" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Open options">
								<!-- simple chevron-down icon -->
								<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
									<path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
								</svg>
	
							</button>
						</div>
					</div>
				</div>
			</section>
	
			<!-- Chips Section -->
			<section class="form_section">
				<h2>Chips</h2>
				<div class="form_row">
					<div class="state-group">
						<div class="chip" tabindex="0">Label</div>
					</div>
				</div>
			</section>
	
			<!-- Checkbox Section -->
			<section class="form_section">
				<h2>Checkbox</h2>
				<div class="form_row">
					<div class="state-group">
						<div class="checkbox-group">
							<input type="checkbox" id="cb1" class="checkbox" tabindex="0">
							<label for="cb1" class="checkbox-label"></label>
						</div>
					</div>
	
				</div>
			</section>
	
			<!-- Radio Button Section -->
			<section class="form_section">
				<h2>Radio button</h2>
				<div class="form_row">
					<div class="state-group">
						<div class="radio-group">
							<input type="radio" id="rb1" name="radio1" class="radio" tabindex="0">
							<label for="rb1" class="radio-label"></label>
						</div>
					</div>
	
				</div>
			</section>
	
			<!-- Tabs Section -->
			<section class="form_section">
				<h2>Tabs</h2>
				<div class="form_row">
					<div class="state-group">
						<div class="tab" tabindex="0">Tab</div>
						<div class="tab" tabindex="0">Tab</div>
						<div class="tab" tabindex="0">Tab</div>
						<div class="tab" tabindex="0">Tab</div>
					</div>
	
				</div>
			</section>
	
			<!-- Switch Section -->
			<section class="form_section">
				<h2>Switch</h2>
				<div class="form_row">
					<div class="state-group">
						<div class="switch-group">
							<input type="checkbox" id="sw1" class="switch" tabindex="0">
							<label for="sw1" class="switch-label"></label>
						</div>
					</div>
				</div>
				<div class="switch-group">
				</div>
			</section>
	
			<!-- Text Field Section -->
			<section class="form_section">
				<h2>Text field</h2>
				<div class="form_row">
					<div class="state-group">
						<div class="text-field-group">
							<label class="text-field-label">Label</label>
							<input type="text" class="text-field" placeholder="Input" tabindex="0">
						</div>
					</div>
				</div>
			</section>
		</div>
	</div>
	<script>
		$(document).ready(()=>{
		
		})
	</script>
</body>
</html>
