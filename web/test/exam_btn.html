<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>3D Button</title>

<func>
	makeCssJson(&s) {
		ss='{'
		while(s.valid(),n) {
			not(s.ch()) break;
			k=replaceCssName(s.findPos(':'))
			v=s.findPos(';').trim()
			if(n) ss.add(',')
			c=v.ch()
			if(c.eq() || typeof(v,'num')) {
				ss.add(k,':',v)
			} else {
				ss.add(k,':',Cf.jsValue(v))
			}
		}
		ss.add('}')
		return ss;
	}
	replaceCssName(&s) {
		ss=''
		while(s.valid(), n) {
			not(s.ch()) break;
			left = s.findPos('-').trim()
			if(n.eq(0)) {
				ss.add(left)
			} else {
				ss.add(upperFirst(left))
			}
		}
		return ss;
		upperFirst = func(&s) {
			ss=''
			while(s.valid(), n) {
				c=s.ch()
				if(n.eq(0)) ss.add(c.upper()) else ss.add(c);
				s.incr()
			}
			print("ss====$ss")
			return ss;
		};
	}

	<link rel="styleSheet" href="/assets/css/buttons.css"/>
	<link
	href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap"
	rel="stylesheet"
	/>
	<style>
	body {
		width: 100%;
		height: 100vh;
		margin: 0;
		padding: 0;
	}
	.container {
		width: 100%;
		height: 100%;
		background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
		display: flex;
		flex-direction: column;
		align-items: center;		
		color: white;
		overflow: auto;
	} 
	.buttons-grid {
		display: grid;
		grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
		gap: 30px;
		width: 100%;
	}
	.button-card {
		display: flex;
		flex-direction: column;
		justify-content: center;
		padding: 4px 40px
	}
	</style>
	<script src="/assets/js/jquery.js"></script>
	<script src="/assets/js/common.js"></script>
</head>
<body>
	<div class="container">
		<div class="buttons-grid">
            <!-- Button 16 -->
            <div class="button-card">
                <h3 class="button-title">Particle Explosion</h3>
                <button class="btn btn-particle">Explode</button>
            </div>
            
            <!-- Button 17 -->
            <div class="button-card">
                <h3 class="button-title">Liquid Fill Effect</h3>
                <button class="btn btn-liquid">Liquid Fill</button>
            </div>
            
            <!-- Button 18 -->
            <div class="button-card">
                <h3 class="button-title">Holographic Effect</h3>
                <button class="btn btn-holographic">Hologram</button>
            </div>
            
            <!-- Button 19 -->
            <div class="button-card">
                <h3 class="button-title">Morphing Shape</h3>
                <button class="btn btn-morph">Morph</button>
            </div>
            
            <!-- Button 20 -->
            <div class="button-card">
                <h3 class="button-title">Sliding Panels</h3>
                <button class="btn btn-slide-panels">Slide Panels</button>
            </div>
            
            <!-- Button 21 -->
            <div class="button-card">
                <h3 class="button-title">Glitch Effect</h3>
                <button class="btn btn-glitch" data-text="Glitch">Glitch</button>
            </div>
            
            <!-- Button 22 -->
            <div class="button-card">
                <h3 class="button-title">Matrix Style</h3>
                <button class="btn btn-matrix">Matrix</button>
            </div>
            
            <!-- Button 23 -->
            <div class="button-card">
                <h3 class="button-title">Gravity Effect</h3>
                <button class="btn btn-gravity">Gravity</button>
            </div>
            
            <!-- Button 24 -->
            <div class="button-card">
                <h3 class="button-title">Confetti Animation</h3>
                <button class="btn btn-confetti">Confetti</button>
            </div>
            
            <!-- Button 25 -->
            <div class="button-card">
                <h3 class="button-title">Cyberpunk Style</h3>
                <button class="btn btn-cyberpunk">Cyberpunk</button>
            </div>
            
            <!-- Button 26 -->
            <div class="button-card">
                <h3 class="button-title">Jelly Animation</h3>
                <button class="btn btn-jelly">Jelly</button>
            </div>
            
            <!-- Button 27 -->
            <div class="button-card">
                <h3 class="button-title">Spotlight Effect</h3>
                <button class="btn btn-spotlight">Spotlight</button>
            </div>
            
            <!-- Button 28 -->
            <div class="button-card">
                <h3 class="button-title">Split Text Effect</h3>
                <button class="btn btn-split" data-text="Split Text"><span>S</span><span>p</span><span>l</span><span>i</span><span>t</span></button>
            </div>
            
            <!-- Button 29 -->
            <div class="button-card">
                <h3 class="button-title">Gradient Border</h3>
                <button class="btn btn-gradient-border">Gradient Border</button>
            </div>
            
            <!-- Button 30 -->
            <div class="button-card">
                <h3 class="button-title">Infinite Loop</h3>
                <button class="btn btn-infinite">Infinite</button>
            </div>
        </div>
	</div>
	<script>
		$(document).ready(()=>{
			$('.btn').each((i, btn)=>{
				$(btn).on('click', ()=>{
					$(btn).addClass('active').css({transform: 'scale(0.95)'});
					setTimeout(()=>{
						clog('timeout btn=>', btn)
						$(btn).css({transform:''}).removeClass('active')
					}, 200);
				})
			})
		})
	</script>
</body>
</html>
