<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
  <link rel="shortcut icon" type="image/ico" href="favicon.ico" />
  <title>SlickGrid example 12: Fill browser</title>
  <link rel="stylesheet" href="/assets/js/slick/css/example-demo.css" type="text/css"/>
  <link rel="stylesheet" href="/assets/js/slick/css/slick-alpine-theme.css" type="text/css"/>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: White;
      overflow: auto;
    }

    body {
      font: 11px Helvetica, Arial, sans-serif;
    }
	#container {
		flex:1;
	}
    #container-old {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }

    #description {
      position: fixed;
      top: 30px;
      right: 30px;
      width: 25em;
      background: beige;
      border: solid 1px gray;
      z-index: 1000;
    }

    #description h2 {
      padding-left: 0.5em;
    }

    /** override slick-cell to make it look like Excel sheet */
    .slick-container {
      --alpine-header-column-height: 20px;
      --alpine-header-font-weight: 500;
      --alpine-cell-border-width: 0 1px 1px 0;
      --alpine-cell-border-color: #d4d4d4;
    }
  </style>
</head>
<body>
<div style="display:flex;flex-direction:column;width:100%;height:100vh;">
<div style="height:30px; background:#aaa">header</div>
<div id="container"></div>
<div style="height:30px; background:#aaa">footer</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sortablejs/Sortable.min.js"></script>

<script src="/assets/js/slick/script/slick.core.js"></script>
<script src="/assets/js/slick/script/slick.interactions.js"></script>
<script src="/assets/js/slick/script/slick.grid.js"></script>
<script>
  var grid,
      data = [],
      columns = [
          { id: "title", name: "Title", field: "title", width: 120, sortable:true },
          { id: "duration", name: "Duration", field: "duration", width: 120 },
          { id: "%", name: "% Complete", field: "percentComplete", width: 120 },
          { id: "start", name: "Start", field: "start", width: 120 },
          { id: "finish", name: "Finish", field: "finish", width: 120 },
          { id: "effort-driven", name: "Effort Driven", field: "effortDriven", width: 120 },
          { id: "c7", name: "C7", field: "c7", width: 120 },
          { id: "c8", name: "C8", field: "c8", width: 120 },
          { id: "c9", name: "C9", field: "c9", width: 120 },
          { id: "c10", name: "C10", field: "c10", width: 120 },
          { id: "c11", name: "C11", field: "c11", width: 120 },
          { id: "c12", name: "C12", field: "c12", width: 120 },
          { id: "c13", name: "C13", field: "c13", width: 120 },
          { id: "c14", name: "C14", field: "c14", width: 120 },
          { id: "c15", name: "C15", field: "c15", width: 120 },
          { id: "c16", name: "C16", field: "c16", width: 120 },
          { id: "c17", name: "C17", field: "c17", width: 120 }
      ],
      options = {
        enableCellNavigation: false,
        enableColumnReorder: false
      };

  for (var i = 100; i-- > 0;) {
    data[i] = {
        title: "Task " + i,
        duration: "5 days",
        percentComplete: Math.round(Math.random() * 100),
        start: "01/01/2009",
        finish: "01/05/2009",
        effortDriven: (i % 5 == 0),
        c7: "C7-" + i,
        c8: "C8-" + i,
        c9: "C9-" + i,
        c10: "C10-" + i,
        c11: "C11-" + i,
        c12: "C12-" + i,
        c13: "C13-" + i,
        c14: "C14-" + i,
        c15: "C15-" + i,
        c16: "C16-" + i,
        c17: "C17-" + i
    };
  }

  grid = new Slick.Grid("#container", data, columns, options);
  grid.setSelectionModel(new Slick.RowSelectionModel());
  grid.onSort.subscribe(function (e, args) {
		data.sort(function (dataRow1, dataRow2) {
			console.log('args =>',args)
			var field = args.sortCol.field;
			var sign = args.sortAsc ? 1 : -1;
			var value1 = dataRow1[field];
			var value2 = dataRow2[field];
			
			var result = (value1 == value2 ? 0 : (value1 > value2 ? 1 : -1)) * sign;
			return result;
		});

		grid.invalidate();
		grid.render();
	});
	grid.onClick.subscribe((e,args)=>console.log('click',e,args))
</script>
</body>
</html>
