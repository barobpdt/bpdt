<func>
	makeCssJson(&s) {
		ss='{'
		while(s.valid(),n) {
			not(s.ch()) break;
			k=replaceCssName(s.findPos(':'))
			v=s.findPos(';').trim()

		ss.add('}')
		return ss;

	replaceCssName(&s) {
		ss=''
		while(s.valid(), n) {
			not(s.ch()) break;
			left = s.findPos('-').trim()
			if(n.eq(0)) {
				ss.add(left)
			} else {
				ss.add(upperFirst(left))
			}

			}

  <body>
    <div class="center">
      <button type="button" class="btn3d">
        <div class="top">Click Me!</div>
        <div class="bottom"></div>
      </button>
    </div>
	<script>
		const apiGet = async (url) => {
			const res = await fetch(url)
			return res.text()
		}
		class Btn3d {
			constructor(target, style) {
				loadStyle(style)
				this.target = getJq(target)
				this.el = $('<button type="button" class="btn3d"/>').css({marginLeft:10}).appendTo(target)
				this.el.on('click', this.clikButton.bind(this))
				$('<div class="top">').html('test').appendTo(this.el)
				$('<div class="bottom">').appendTo(this.el)
			}
			clikButton() {
				clog('this=>>', this)
				alert('click test')
			}
		}
		$(document).ready(async ()=>{ 
			const btn = new Btn3d('.center', await apiGet('http://localhost/api/css/btn3d'))
			clog('btn=>', btn)
		})
	</script>
  </body>
