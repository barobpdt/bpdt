<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="X-UA-Compatible" content="IE=edge"/>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
<link rel="shortcut icon" type="image/ico" href="favicon.ico" />
<title>레이아웃 테스트</title>
<link rel="stylesheet" href="/assets/css/styles.css" type="text/css"/>
<script src="/assets/js/jquery.js"></script>
<script src="/assets/js/common.js"></script>
<style>
	* {
		box-sizing: border-box;
		margin: 0;
		padding: 0;
	}
	body {
		font-family: Arial, sans-serif;
		display: flex;
		justify-content: center;
		align-items: center;
	
		flex-direction: column;
		background: #111;
		overflow-x: hidden;
		min-height: 200vh;
	} 
	section {
		position: fixed;
		top: 0;
		left: 0;
		width: 100%;
		height: 100%;
		background: #fff;
		display: flex;
		justify-content: center;
		align-items: center;
		clip-path: circle(230px at left center);
		z-index: 2;
	}
	.title {
		position: fixed;
		top: 50%;
		transform: translateY(-50%);
		width: 100%;
		text-align: center;
		color: #0af;
		z-index: 1;
		font-size: 25vw;
	}
	.inner-title {
		position: fixed;
		top: 50%;
		transform: translateY(-50%);
		width: 100%;
		text-align: center;
		color: #0af;
		z-index: 1;
		font-size: 25vw;
		background-image: url(../assets/images/background-test.png);
		background-attachment: fixed;
		background-size: cover;
		background-position: center;
		-webkit-background-clip: text;
		-webkit-text-fill-color: transparent;
	}
</style>
</head>
<body style="margin:0;padding:0"> 
	<h2 class="title">Forest</h2>
	<section>
		<h2 class="inner-title">Forest</h2>
	</section>
	<script>
		$(document).ready(async ()=>{ 
			clog('exam_scroll loaded')
			const section = $('section');
			$(window).on('scroll', ()=>{
				let scrollY = $(window).scrollTop();
				section.css({'clip-path': `circle(${230 + (2*scrollY)}px at left center)`})
			})
		})
	</script>
</body>
</html>
