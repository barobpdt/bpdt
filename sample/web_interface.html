<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastAPI SQLite CRUD 샘플</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
            padding: 25px;
            border: 1px solid #e1e5e9;
            border-radius: 10px;
            background: #f8f9fa;
        }

        .section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #555;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.2s;
            margin-right: 10px;
            margin-bottom: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
        }

        .btn-success {
            background: linear-gradient(135deg, #51cf66 0%, #40c057 100%);
        }

        .btn-warning {
            background: linear-gradient(135deg, #ffd43b 0%, #fcc419 100%);
            color: #333;
        }

        .users-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .user-card {
            background: white;
            border: 1px solid #e1e5e9;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            transition: transform 0.2s;
        }

        .user-card:hover {
            transform: translateY(-5px);
        }

        .user-card h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.2em;
        }

        .user-info {
            margin-bottom: 15px;
        }

        .user-info p {
            margin: 5px 0;
            color: #666;
        }

        .user-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-active {
            background: #d4edda;
            color: #155724;
        }

        .status-inactive {
            background: #f8d7da;
            color: #721c24;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }

        .stat-label {
            color: #666;
            font-size: 1.1em;
        }

        .message {
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            font-weight: 600;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 FastAPI SQLite CRUD 샘플</h1>
            <p>사용자 관리 시스템</p>
        </div>

        <div class="content">
            <!-- 메시지 표시 영역 -->
            <div id="message"></div>

            <!-- 통계 섹션 -->
            <div class="section">
                <h2>📊 사용자 통계</h2>
                <button class="btn" onclick="loadStats()">통계 새로고침</button>
                <div id="stats" class="stats">
                    <div class="loading">통계를 불러오는 중...</div>
                </div>
            </div>

            <!-- 사용자 생성 섹션 -->
            <div class="section">
                <h2>➕ 새 사용자 생성</h2>
                <form id="createForm">
                    <div class="form-group">
                        <label for="name">이름 *</label>
                        <input type="text" id="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">이메일 *</label>
                        <input type="email" id="email" required>
                    </div>
                    <div class="form-group">
                        <label for="age">나이</label>
                        <input type="number" id="age" min="1" max="150">
                    </div>
                    <div class="form-group">
                        <label for="isActive">활성 상태</label>
                        <select id="isActive">
                            <option value="true">활성</option>
                            <option value="false">비활성</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-success">사용자 생성</button>
                </form>
            </div>

            <!-- 사용자 검색 섹션 -->
            <div class="section">
                <h2>🔍 사용자 검색</h2>
                <div class="form-group">
                    <label for="searchName">이름으로 검색</label>
                    <input type="text" id="searchName" placeholder="검색할 이름을 입력하세요">
                </div>
                <button class="btn" onclick="searchUsers()">검색</button>
                <button class="btn btn-warning" onclick="loadUsers()">전체 목록</button>
            </div>

            <!-- 사용자 목록 섹션 -->
            <div class="section">
                <h2>👥 사용자 목록</h2>
                <button class="btn" onclick="loadUsers()">목록 새로고침</button>
                <div id="users" class="users-grid">
                    <div class="loading">사용자 목록을 불러오는 중...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';

        // 메시지 표시 함수
        function showMessage(message, type = 'success') {
            const messageDiv = document.getElementById('message');
            messageDiv.innerHTML = `<div class="message ${type}">${message}</div>`;
            setTimeout(() => {
                messageDiv.innerHTML = '';
            }, 5000);
        }

        // API 호출 함수
        async function apiCall(url, options = {}) {
            try {
                const response = await fetch(`${API_BASE}${url}`, {
                    headers: {
                        'Content-Type': 'application/json',
                        ...options.headers
                    },
                    ...options
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'API 호출 실패');
                }
                
                return await response.json();
            } catch (error) {
                console.error('API Error:', error);
                throw error;
            }
        }

        // 통계 로드
        async function loadStats() {
            try {
                const stats = await apiCall('/stats/users');
                const statsDiv = document.getElementById('stats');
                
                statsDiv.innerHTML = `
                    <div class="stat-card">
                        <div class="stat-number">${stats.total_users}</div>
                        <div class="stat-label">전체 사용자</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">${stats.active_users}</div>
                        <div class="stat-label">활성 사용자</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">${stats.inactive_users}</div>
                        <div class="stat-label">비활성 사용자</div>
                    </div>
                `;
            } catch (error) {
                showMessage(`통계 로드 실패: ${error.message}`, 'error');
            }
        }

        // 사용자 목록 로드
        async function loadUsers() {
            try {
                const users = await apiCall('/users/');
                displayUsers(users);
            } catch (error) {
                showMessage(`사용자 목록 로드 실패: ${error.message}`, 'error');
            }
        }

        // 사용자 검색
        async function searchUsers() {
            const searchName = document.getElementById('searchName').value.trim();
            if (!searchName) {
                showMessage('검색할 이름을 입력해주세요.', 'error');
                return;
            }

            try {
                const users = await apiCall(`/users/search/${encodeURIComponent(searchName)}`);
                displayUsers(users);
                showMessage(`"${searchName}" 검색 결과: ${users.length}명`);
            } catch (error) {
                showMessage(`검색 실패: ${error.message}`, 'error');
            }
        }

        // 사용자 목록 표시
        function displayUsers(users) {
            const usersDiv = document.getElementById('users');
            
            if (users.length === 0) {
                usersDiv.innerHTML = '<div class="loading">사용자가 없습니다.</div>';
                return;
            }

            usersDiv.innerHTML = users.map(user => `
                <div class="user-card">
                    <h3>${user.name}</h3>
                    <div class="user-info">
                        <p><strong>이메일:</strong> ${user.email}</p>
                        <p><strong>나이:</strong> ${user.age || '미입력'}</p>
                        <p><strong>생성일:</strong> ${new Date(user.created_at).toLocaleDateString()}</p>
                        <span class="user-status ${user.is_active ? 'status-active' : 'status-inactive'}">
                            ${user.is_active ? '활성' : '비활성'}
                        </span>
                    </div>
                    <button class="btn btn-warning" onclick="editUser(${user.id})">수정</button>
                    <button class="btn btn-danger" onclick="deleteUser(${user.id})">삭제</button>
                </div>
            `).join('');
        }

        // 사용자 생성
        document.getElementById('createForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                age: parseInt(document.getElementById('age').value) || null,
                is_active: document.getElementById('isActive').value === 'true'
            };

            try {
                await apiCall('/users/', {
                    method: 'POST',
                    body: JSON.stringify(formData)
                });
                
                showMessage('사용자가 성공적으로 생성되었습니다.');
                document.getElementById('createForm').reset();
                loadUsers();
                loadStats();
            } catch (error) {
                showMessage(`사용자 생성 실패: ${error.message}`, 'error');
            }
        });

        // 사용자 수정 (간단한 프롬프트 사용)
        async function editUser(userId) {
            const newAge = prompt('새로운 나이를 입력하세요:');
            if (newAge === null) return;
            
            const newStatus = confirm('활성 상태로 변경하시겠습니까?') ? true : false;
            
            try {
                await apiCall(`/users/${userId}`, {
                    method: 'PUT',
                    body: JSON.stringify({
                        age: parseInt(newAge) || null,
                        is_active: newStatus
                    })
                });
                
                showMessage('사용자 정보가 수정되었습니다.');
                loadUsers();
                loadStats();
            } catch (error) {
                showMessage(`사용자 수정 실패: ${error.message}`, 'error');
            }
        }

        // 사용자 삭제
        async function deleteUser(userId) {
            if (!confirm('정말로 이 사용자를 삭제하시겠습니까?')) return;
            
            try {
                await apiCall(`/users/${userId}`, {
                    method: 'DELETE'
                });
                
                showMessage('사용자가 삭제되었습니다.');
                loadUsers();
                loadStats();
            } catch (error) {
                showMessage(`사용자 삭제 실패: ${error.message}`, 'error');
            }
        }

        // 페이지 로드 시 초기 데이터 로드
        window.addEventListener('load', () => {
            loadUsers();
            loadStats();
        });
    </script>
</body>
</html>
