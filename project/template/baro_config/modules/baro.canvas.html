<script module="canvas">
	init() {
		config=baseConfig()
		config[
			@font & 'size:9',
			@baseColor & color('#121131').lightColor(100) => @font, @baseColor
		]		
		this.font(font)
		this[@font, @baseColor]
	}	
	canvasSize() {
		return this.rect().size()
	}
	updateCheck(rc) {
		print("@@ upate check updateCheckTick==${this.updateCheckTick}") 
		this.var(@rectCanvas, rc)
		this.updateCheckTick=System.tick()
		this.updateCanvas()
	}
	updateCanvas() {
		print("@@ canvas 객체에 updateCanvas 함수 중복정의 하세요")
	}	
	
	mouseMove(pos) {
		this[=>@form] not(form) return false;
		return this.mouseMoveForm(pos, form)
	}
	clickButton(currentNode) {
		print("@@ click button =>" currentNode)
	}
	onTimer() {
		if(this.var(@useMdc)) {
			this.timerClipCheck()
		}
	}
	drawClip(dc, rc) {
		
	}
	onDraw(dc,rc) {
		if( rc.eq(this.rect()) ) {
			this[@rectCanvas->rcPrev] not( rc.eq(rcPrev) ) this.updateCheck(rc)
		} else {
			if(this[@useMdc]) {
				this.drawMdcClip(dc,rc)
			} else {
				this.drawClip(dc,rc)
			}
			return;
		}		
		this[=>@form, @useMdc, @useDrawPath, @pathList]
		if( typeof(this.drawBackground,'func') ) {
			this.drawBackground(dc,rc)
		}
		if( form ) {
			this.drawForm(dc,form)				
		}
		if( useMdc) {
			this.drawMdc(dc)
		}		
		
		if( useDrawPath && isValid(pathList) ) {
			dc.save()
			dc.drawPath(pathList, this.baseColor)
			dc.restore()
		}
	}
	
	onMouseDown(pos) {
		if(this[@form] && this.mouseDownForm(pos) ) return true;
		if(this[@useMdc] && this.mouseDownMdc(pos) ) return true;
		
	}
	onMouseUp(pos) {
		if(this[@form] && this.mouseUpForm(pos) ) return true;	
		if(this[@useMdc] && this.mouseUpMdc(pos) ) return true;
	}
	
</script>

<script module="canvas_mdc">
	init() {
		this[
			@mdcList:array,
			@overlayList:array,
			@clipList:array,
			@pathList:array,
			@useMdc=true,
			@useDrawPath=false
		]
		this.timer(500)
	}
	drawMdc(dc) {
		while(mdc, this[@mdcList]) {
			mdc.draw(dc)
		}
		while(pair, this.timeline()) {
			pair.inject(code, tm)
			if( tm.state()) {
				target = tm.config().get('target')				
				if( target && target.drawTimeline(dc, code, tm) ) break;
			}
		}
		while(mdc, this[@overlayList]) {
			// @cause, @rectOverlay, @offset
			mdc.drawOverlay(dc)
		}
	} 
	drawMdcClip(dc,rc) {
		while(mdc, this[@clipList]) {
			mdc[@rectClip->rcClip] not(rcClip) continue;
			if(rc.eq(rcClip)) {
				return mdc.drawClip(dc,rc)
			}
		}
	}
	mouseDownMdc(pos) {
		this[=>@mdcList] if(notValid(mdcList)) return;
		while(n=mdcList.size()-1,0) {
			if( mdcList[n].mouseDownDefault(pos) ) return true;
		}
	}
	mouseUpMdc(pos) {
		this[=>@mdcList] if(notValid(mdcList)) return;
		while(n=mdcList.size()-1,0) { 
			if( mdcList[n].mouseUpDefault(pos) ) return true;
		}
	}
	
	timerClipCheck() {
		while(mdc, this[@clipList]) {
			rect=mdc.getClipRect() not(typeof(rect,'rect')) continue;
			mdc[=>@clipTick, @clipDuration]
			if( checkTick(clipTick, clipDuration)) {
				this.update(rect)
				break;
			} 
		}
	}
	addTimeline(timelineCode, target, checkStart) {
		tm=this.timeline(timelineCode)
		tm.config().set('target', target)
		if( checkStart ) {
			tm.start(20,800)
		}
		return tm;
	}
	removeTimeline(timelineCode) { 
		while(pair, this.timeline(), idx) {
			pair.inject(code, tm)
			if(code.eq(timelineCode)) {
				tm.stop()
				this.timeline().remove(idx)
				return true;
			}
		}
		return false;
	}	
	addClipMdc(mdc) {
		not(this[@clipList->list].find(mdc)) {
			list.add(mdc)
		}
	}
	removeClipMdc(mdc) {
		this[@clipList].remove(mdc)
	}
	addMdcList(mdc, redraw) {
		not(this[@mdcList->list].find(mdc)) {
			list.add(mdc)
			mdc.drawDc()
		}
		if(redraw) {
			this.update()
		}
		return mdc;
	}
	getMdc(mdcId, moduleType) {		
		this[=>@baseCode, id]
		dc=mdc("$baseCode#$id.$mdcId")
		if( moduleType ) {
			not(dc[@useModule]) {
				addModule(dc,"mdc,$moduleType")
				dc[@canvas]=this
			}
		}
		return dc;
	}
	addMdc(param, rectDraw, moduleType, baseColor) {
		if(typeof(param,'node')) {
			dc=param;
		} else {
			dc=this.getMdc(param, moduleType)
		}
		if( typeof(rectDraw,'bool') ) {
			if(dc[@img]) {
				this.addMdcList(dc, rectDraw)
			} else {
				print("@@ canvas addMdc $param 메모리그리기 객체가 생성되지 않았습니다")
			}
			return;
		}
		dc[@canvas]=this
		if(typeof(rectDraw,'rect')) {
			rectDraw.inject(x,y,w,h)
			rectAvail=rc(0,0,w,h)
			offset=pt(x,y)
			mdc(dc, w, h)
			dc[@rectDraw,@rectAvail,@offset]
		}
		if(baseColor) {
			if(typeof(baseColor,'string')) {
				baseColor=color(baseColor)
			}
		} else {
			not( dc.var(baseColor) ) {
				baseColor=this.baseColor
				not(baseColor) baseColor=randomColor()
			}
		}
		not( dc[@useModule] ) {
			if(moduleType) {
				addModule(dc,"mdc,$moduleType") 
			}
		} 
		dc[@baseColor,@moduleType]
		if(dc[@rectAvail:rect->avail, @rectAvailPrev->prev]) {
			not(avail.eq(prev)) {
				dc.updateMdc()
				dc[@rectAvailPrev]=avail
			}
			dc.drawDc()
		}
		return this.addMdcList(dc)
	}
	removeMdc(mdc, checkUpdate) {
		this[@mdcList->list]
		list.remove(mdc)
		if(checkUpdate) this.update()
	}	
	addOverlay(mdc) {
		this[@overlayList->list]
		not( list.find(mdc)) list.add(mdc)
		this.update()
	}
	removeOverlay(mdc) {
		this[@overlayList->list]
		list.remove(mdc)
		this.update()
	}
	
	
</script>

<script module="canvas_form" note="canvas 폼처리함수 함수">

	initForm(formInfo) {		
		this[@form:node()->form]
		lineCount=getLineCount(formInfo)
		not(lineCount) {
			form[@error='폼정보 미정의']
			return form;
		}
		if(lineCount.eq(1) && formInfo.find('.') ) {
			formInfo = conf(formInfo)
		} 
		form.parseJson(formInfo)
		form[=>formItems, heights]
		if(typeof(formItems,'array')) {
			if(typeof(formItems[0],'array')) {
				not(heights) form[heights=formItems.size()]
			}		
		} else {
			form.var(@error, '폼아이템 정보 미정의', formInfo)
		}
		canvas = this
		while(cur,form) {
			cur[=>tag, code]
			if(tag.eq('btn','space','label','check','radio')) {
				this[@useDraw=true]
				if(tag.eq('btn','check','radio')) {
					this[@useMouseEvent=true]
				}
			} else if(tag) {
				this.var(@widget, createWidget(tag,code,canvas,'',true) )
			}
		}
		return form;
	}
	
	updateForm(form,rect) {
		if(form[=>@error]) {
			print("@@캔바스 updateForm 오류: $error")
			return;
		}
		// ex) form={formRows:'40,*,30', formItmes:[...]}
		form[@formRects:array->rowRectArray]
		form[=>formItems, formRows]
		if( formItems.size() > 1 ) { 
			// 폼이 여러줄인경우 rowRectArray 행영역배열 생성(vbox)
			not(formRows) formRows=formItem.size()
			vbox(rect, formRows, rowRectArray.reuse())
			while(rows, formItems, rowIndex) {
				fieldCount = rows.size()
				while(cur, rows) {
					not(typeof(cur,'node')) continue;
					cur[@rowIndex, @fieldCount]
				}
			}
			if( isValid(rowRectArray) ) {
				while(rows, formItems, row) {
					rect=rowRectArray[row]
					form[!info $row]=this.getFormRowInfo(rows)
					colRectArr=hbox(rect, form[info $row])
					while(cur, rows, col) {
						cur[rect]=colRectArr[col]
					}
				}
			}
		}
		else if(isValid(rowRectArray)) {
			// 영역배열로 자유로운 위치에 폼아이템 배치
			while(cur, formItems, row) {
				cur[rect]=rowRectArray[row]
			}
		} 
		else if(rect) {
			// 폼이 한줄인 경우
			form[!info 0]=this.getFormRowInfo(formItems)
			colRectArr=hbox(rect, form[info $row])
			while(cur, formItems, col) {
				cur[rect]=colRectArr[col]
			}
		}
	}
	drawForm(dc,form) {
		this.inject(@currentDownNode, @currentOverNode)
		while(cur, form) {
			cur[=>@widget, @rect, @useDraw, @useMouseEvent, tag] not(rect) continue;
			if( widget) {
				widget.move(rect)
				if(hide) widget.hide()
				continue;
			}
			if(useMouseEvent) {
				switch(tag) {
				case btn: this.drawBtn(dc,rect,cur)
				case check: this.drawCheckbox(dc,rect,cur)
				case radio: this.drawRadiobox(dc,rect,cur)
				}
			}
			else if(useDraw) {
				this.drawLabelText(dc,rect,cur)
			}			
		}
	}
	drawBtn(dc,rc,cur) {
		cur.inject( code, text, disable, hide )
		print("draw btn >> ", cur)
	}
	drawCheckbox(dc,rc,cur) {
		cur.inject( code, text, disable, hide )
	}
	drawRadiobox(dc,rc,cur) {
		cur.inject( code, text, disable, hide )
	}
	drawLabelText(dc,rc,cur) {
		cur.inject( code, text, disable, hide )
	}

	mouseDownForm(pos) {
		while(cur, form) {
			cur.inject(@useMouseEvent, rect)
			not(useMouseEvent) continue;
			not(rect.contains(pos)) continue;
			this.var(currentDownNode,cur)
			this.update()
			return true;
		}
		return false;
	}
	mouseUpForm(pos) {
		this.inject(@currentDownNode) not(currentDownNode) return false;		
		checkContain=false
		if( rect.contains(pos)) {
			this.clickButton(currentDownNode)
			checkContain=true
		}		
		this.var(@currentDownNode, null)
		this.update()
		return checkContain;
	}
	getFormRowInfo(rows) { 
		arr=[]
		while(cur, rows) {
			cur[=>@widget, @useDraw, tag, width]
			if(width) {
				arr.add(width)
			} else if(@widget) {
				if(tag.eq('canvas','grid','editor','splitter','div','space')) {
					arr.add('*')
				} else if(tag.eq('date','time')) {
					arr.add(125)
				} else if(tag.eq('combo','input')) {					
					arr.add(150)
				}
			} else if(@useDraw) {
				cur[=>icon, font, text, padding, image]
				tw=0
				if(text) {
					not(font) font=this[@baseFont]
					getTextSize(text,font).inject(tw,th)
					tw+=20
					if(icon) {
						tw+=45
					}			
				} 
				if(tag.eq('check')) {
					cur.var(@checkIcon, 'icons:check1')
					tw+=40
				}	
				else if(image) {
					getImageSize(image).inject(iw,ih)
					tw=iw
				}
				if(tw) {
					if(padding) tw+=padding*2
					arr.add(tw)
				} else {
					arr.add(100)
				}					
			} else {
				arr.add(20)
			}
		}
		return arr.join()
	}
</script>

<script type="common" note="canvas 공통 함수">
	initForm(formInfo) {
		not(typeof(this,'widget')) return;
		not(this.initForm) {
			addModule(this,'canvas_form')
		}
		return this.initForm(formInfo)
	}
	isMdcSizeChange(mdc, w,h) {
		mdc.var(rect).size().inject(mw,mh)
		if(mw.eq(w) && mh.eq(h)) {			
			return false;
		}
		print("mdc size change", mw,mh,w,h)
		return true;
	}
	getTextSize(text, style) {
		dc=Cf.getObject('mdc','get_text_size') 
		not(dc) {
			dc=mdc('get_text_size', 1000, 200)
		}
		if(style) {
			dc.font(style)
		}
		return dc.textSize(text)
	}
	mdc(check) {
		if(typeof(check,'node')) {
			args(d, param)
		} else if(typeof(check,'string')) {
			args(id, param)
			d=Cf.getObject('mdc',id) 
			not(d) {
				d=Cf.getObject('mdc',id, true)
				d.id=id
			}
		}
		not(param) return d;
		img=null
		if(typeof(param,'string')) {
			img=Cf.imageLoad(param)
		} else if(typeof(param,'image')) {
			img=param
		} else if(typeof(param,'node')) {
			img=param.var(image)
		} 
		if(img) {
			if( d.var(img)) {
				d.destroy()
				d.var(rect, null)
			}
			Baro.drawObject(d,img)
			return d;
		}

		if(typeof(param,'point')) {
			param.inject(width, height);
		} else if(typeof(param,'widget')) { 
			param.rect().inject(x,y,width, height)
		} else if(typeof(param,'rect')) { 
			param.size().inject(width, height);
		} else {
			args(1,width, height)
		}
		not( typeof(width,'num') && typeof(height,'num')) {
			return print("메모리 DC생성 영역오류(폭:$width 높이:$height)", param);
		}
		if(d.var(rect)) {
			d.var(rect).size().inject(w, h)
			if( width.eq(w) && height.eq(h) ) {
				return d;
			} 
			d.destroy()
			d.var(rect, null)
		} 
		Baro.drawObject(d, width, height);
		return d;
	}
</script>

<script type="draw" note="공통 그리기 함수">
	roundBox(dc, rcBox, rad, penColor) {
		dc.save()
		dc.mode()
		not(penColor) penColor=null
		rad2=rad*2;
		lt=rcBox.leftTop(rad2,rad2), rt=rcBox.rightTop(rad2,rad2);
		lb=rcBox.leftBottom(rad2,rad2), rb=rcBox.rightBottom(rad2,rad2);
		path=[]
		path.add('arc',rt, 0, 90, lt.tc(), 'arc', lt, 90,90, lb.lc(), 'arc',lb,180,90, rb.bc(), 'arc',rb,270,90)
		if(type.eq('gradient','radial','conical')) {
			arr=args(5)
			if(type=='gradient') {
				c1=arr.get(0), c2=arr.get(1)
				rc.lt().inject(sx,sy)
				rc.lb().inject(ex,ey)
				dc.drawPath(path, penColor, true,'gradient',sx,sy,ex,ey,0,c1,1,c2)
			} else if(type=='radial') {
				arr.inject(cx, cy, px, py, c1, c2)
				dc.drawPath(path, penColor, true,'radial',cx, cy, px, py,0,c1,1,c2)
			} else {
				arr.inject(cx, cy, c1, c2)
				dc.drawPath(path, penColor, true,'conical',cx, cy, 0,c1,1,c2)
			}
		} else {
			bgColor=type
			if(bgColor) {
				dc.drawPath(path, penColor, true,bgColor)	
			} else {
				dc.drawPath(path, penColor, true)
			}			
		}
		dc.restore()
	}
	
	roundRect(dc, rc, rad, penColor, type) {
		dc.save()
		dc.mode()
		if(penColor) {
			dc.pen(penColor)
		} else {
			dc.pen(null)
		}		
		path=[]
		path.add('round',rc, rad, rad)
		// ex) roundRect(dc, rcBox, 20, c.darkColor(100),'gradient', c, c.darkColor(100) )
		if(type.eq('gradient','radial','conical')) {
			arr=args(5)
			if(type=='gradient') {
				c1=arr.get(0), c2=arr.get(1)
				rc.lt().inject(sx,sy)
				rc.lb().inject(ex,ey)
				dc.drawPath(path, penColor, true,'gradient',sx,sy,ex,ey,0,c1,1,c2)
			} else if(type=='radial') {
				arr.inject(cx, cy, px, py, c1, c2)
				dc.drawPath(path, penColor, true,'radial',cx, cy, px, py,0,c1,1,c2)
			} else {
				arr.inject(cx, cy, c1, c2)
				dc.drawPath(path, penColor, true,'conical',cx, cy, 0,c1,1,c2)
			}
		} else {
			bgColor=type
			if(bgColor) {
				dc.drawPath(path, penColor, true,bgColor)	
			} else {
				dc.drawPath(path, penColor, true)
			}			
		}
		dc.restore()
	} 
</script>

<script type="range" note="영역처리 함수">
	vbox(rc, sizes, param) {
		if(typeof(param,'array')) {
			a=param
		}
		else if(param) {
			a=[]
		} 
		else {
			a=_arr()
		}
		rc.inject(sx,sy,w,h)
		while(hh, recalc(h,sizes)) {
			a.add(rc(sx,sy,w,hh))
			sy+=hh;
		}
		return a;
	}
	hbox(rc, sizes, param) {
		if(typeof(param,'array')) {
			a=param
		}
		else if(param) {
			a=[]
		} 
		else {
			a=_arr()
		}
		rc.inject(sx,sy,w,h)
		while(ww, recalc(w,sizes)) {
			a.add(rc(sx,sy,ww,h))
			sx+=ww;
		}
		return a;
	}
	toRect(rc) {
		rc.inject(x,y,w,h);
		return Baro.rect(x,y,w,h);
	}
	toRc(rc) {
		rc.inject(x,y,w,h);
		return Baro.rc(x,y,w,h);
	} 
	point(param) {
		if(typeof(param,'rect')) {
			return param.lt();
		} else if(typeof(param,'point')) {
			return param;
		} else if(typeof(param,'num')) {
			args(width, height);
			return Baro.point(width, height);
		}
		return Baro.point(0,0);
	} 
	mergeRect(param) {
		cx=0,cy=0,cr=0,cb=0;
		if(typeof(param,'array')) arr=param
		else arr=args()
		while(rc, arr, idx) {
			not(typeof(rc,'rect')) continue;
			rc.inject(x,y,w,h);
			r=x+w, b=y+h;
			if(idx==0) {
				cx=x,cy=y,cr=r,cb=b;
			} else {
				if(x<cx) cx=x;
				if(y<cy) cy=y;
				if(cr<r) cr=r;
				if(cb<b) cb=b;
			}
		}
		w=cr-cx;
		h=cb-cy;
		return rc(cx, cy, w, h)
	}
</script>
