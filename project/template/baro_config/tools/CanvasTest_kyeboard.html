<page margin=0 id="main" module="page_canvas">
	<canvas id="c" module="canvas, canas_test_keyboard">
</page>
  
<script module="canas_test_keyboard">
	updateRect() {
		print("canvas update rect start ===========")
		rect = this.rect()
		this.var(mdcList).reuse()
		hbox(rect, '300,*').inject(left, right)
		this.addMdc('left', left.incr(4), 'mdc_box')
		this.addMdc('right', right.incr(4), 'mdc_box')
		this.addMdc('keyboard',rect.bottomCenter(890, 322, 0, -4),'mdc_keyboard')
		this.update()
	}
</script>
