<script module="canvas_grid_teset">	
	updateCanvas() {
		vbox(this.@rectCanvas, '30,*,40').inject(rcTop, rcBody, rcBottom)
		not(this.@form) {
			this.@form = initForm(conf('form.test_grid_search'))
		}
		grid.move(rcBody.incr(4))
		this.@rcTop=rcTop
		this.@rcBottom=rcBottom
		this.updateForm(this.@form, rcBottom)
	} 
	timerCallback() {
		
	}
	drawBackground(dc) {
		bgColor=this.@baseColor.lightColor(100)
		title='그리드 조회 테스트'
		textColor=this.@baseColor.darkColor(100)
		dc.save().font("size:12, color:${bgColor.lightColor(180)}, weight:bold")
		dc.fill(this.@rcTop, bgColor)
		dc.text(this.@rcTop.incrX(10).move(1,1), title) dc.font("color:$textColor")
		dc.text(this.@rcTop.incrX(10), title)
		fillGradient(dc, this.@rcBottom, bgColor, bgcolor.lightColor(120))
		dc.restore()
	}
</script>
<script module="video_imple">
	onMessage(line) {
		not(line) return;
		// print("onMessage =>$line")
		line.ref()
		type=line.move()
		if(line.ch('=')) {
			val=line.incr().trim()
			switch(type) {
			case ANS_LENGTH:
				this.@streamLength=val.toDouble()
			case ANS_TIME_POSITION:
				this.@currentPos=val.toDouble()
			case ANS_PERCENT_POSITION:
				this.@currentPercent=val.toInt()
			default:
			}
		}		
	}
	onError(err) {
		print("@@ video player error: $err")
	}
	onStateChange(type) {
		print("state change ${this.id} $type")
		switch(type) {
		case play:
			not(this.is('visible')) {
				this.command('seek 0 1')
				this.pause()
			}
		case notStarted:
			canvas=this.parentWidget()
			canvas.togglePlayer()
		default:
		} 
	}
	onDraw(dc) {
		dc.fill('#aaa')
	}

</script>


<conf name="form.test_grid_search">

		{tag:space}
	]
