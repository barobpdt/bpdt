<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💬 메신저</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --border: #30363d;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --primary: #1d6feb;
            --primary-hover: #388bfd;
            --msg-bg: #21262d;
            --msg-mine: #1d6feb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #chat-container {
            width: 100%;
            max-width: 600px;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: var(--panel-bg);
            border-left: 1px solid var(--border);
            border-right: 1px solid var(--border);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* Header */
        #header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-bg);
            z-index: 10;
        }

        #header h1 {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ef4444;
            display: inline-block;
            margin-right: 8px;
        }

        .status-dot.connected {
            background: #22c55e;
        }

        /* Message Area */
        #messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 80%;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.mine {
            align-self: flex-end;
        }

        .message.others {
            align-self: flex-start;
        }

        .bubble {
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-break: break-all;
        }

        .message.mine .bubble {
            background: var(--msg-mine);
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .message.others .bubble {
            background: var(--msg-bg);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }

        .meta {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 4px;
            display: flex;
            gap: 8px;
        }

        .message.mine .meta {
            justify-content: flex-end;
        }

        /* File Links */
        .file-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #58a6ff;
            text-decoration: none;
            font-weight: 500;
        }

        .file-link:hover {
            text-decoration: underline;
        }

        /* Input Area */
        #input-area {
            padding: 16px;
            border-top: 1px solid var(--border);
            background: var(--bg-color);
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        textarea {
            flex: 1;
            background: var(--panel-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            border-radius: 20px;
            padding: 12px 16px;
            font-size: 0.95rem;
            resize: none;
            min-height: 44px;
            max-height: 120px;
            outline: none;
            font-family: inherit;
        }

        textarea:focus {
            border-color: var(--primary);
        }

        textarea::placeholder {
            color: var(--text-muted);
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 1.2rem;
            transition: background 0.2s, transform 0.1s;
            flex-shrink: 0;
        }

        .btn:hover {
            background: var(--primary-hover);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn.secondary {
            background: var(--msg-bg);
            border: 1px solid var(--border);
        }

        .btn.secondary:hover {
            background: var(--border);
        }

        #file-input {
            display: none;
        }

        /* File Upload Progess overlay */
        #progress-overlay {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 50;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 12px;
        }

        .prog-wrap {
            width: 200px;
            height: 6px;
            background: var(--border);
            border-radius: 99px;
            overflow: hidden;
        }

        .prog-bar {
            height: 100%;
            width: 0%;
            background: var(--primary);
            transition: width 0.2s;
        }
    </style>
</head>

<body>

    <div id="chat-container">
        <div id="header">
            <h1><span id="status-dot" class="status-dot"></span>채팅방</h1>
            <div style="font-size:0.8rem; color:var(--text-muted)">명령어 테스트: /open URL, /alert 메세지</div>
        </div>

        <div id="messages">
            <!-- Messages will appear here -->
            <div class="message others">
                <div class="bubble">안녕하세요! 메신저에 접속하셨습니다. 파일 공유나 `/open https://naver.com` 같은 명령어를 입력해 보세요.</div>
                <div class="meta">System</div>
            </div>
        </div>

        <div id="input-area">
            <button class="btn secondary" onclick="document.getElementById('file-input').click()"
                title="파일 첨부">📎</button>
            <input type="file" id="file-input" onchange="handleFileUpload(event)">

            <textarea id="msg-input" placeholder="메시지 입력... (Enter로 전송)"></textarea>

            <button class="btn" onclick="sendMessage()" title="전송">✈️</button>
        </div>

        <div id="progress-overlay">
            <div style="font-weight:600">파일 업로드 중...</div>
            <div class="prog-wrap">
                <div class="prog-bar" id="up-prog"></div>
            </div>
        </div>
    </div>

    <script>
        // 고유 ID 생성 (본인 메시지 구분을 위해)
        const myId = Math.random().toString(36).substring(2, 10);
        let ws;

        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}`;
            ws = new WebSocket(wsUrl);

            const statusDot = document.getElementById('status-dot');

            ws.onopen = () => {
                statusDot.classList.add('connected');
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    receiveMessage(data);
                } catch (e) {
                    console.error("Failed to parse message", e);
                }
            };

            ws.onclose = () => {
                statusDot.classList.remove('connected');
                setTimeout(connectWebSocket, 3000); // Reconnect after 3s
            };
        }

        // 초기 연결
        connectWebSocket();

        // ─── UI 렌더링 ───
        const msgContainer = document.getElementById('messages');
        const inputEl = document.getElementById('msg-input');

        function appendMessageBubble(data) {
            const isMine = data.senderId === myId;
            const el = document.createElement('div');
            el.className = `message ${isMine ? 'mine' : 'others'}`;

            const time = new Date(data.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            let contentHtml = '';
            if (data.type === 'text' || data.type === 'command') {
                // 텍스트는 이스케이프 (기본적인 XSS 방지)
                const safeText = data.text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
                contentHtml = `<div class="bubble">${safeText.replace(/\n/g, '<br>')}</div>`;
            } else if (data.type === 'file') {
                const url = `/api/files/${data.file.id}`;
                const ext = data.file.name.split('.').pop().toLowerCase();
                const isImage = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg'].includes(ext);

                if (isImage) {
                    contentHtml = `
                        <div class="bubble" style="display:flex; flex-direction:column; gap:6px;">
                            <span style="font-size:0.8rem; color:${isMine ? '#bae6fd' : '#8b949e'}">🖼 이미지가 공유되었습니다</span>
                            <a href="${url}" target="_blank">
                                <img src="${url}" alt="${data.file.name}" style="max-width: 100%; max-height: 250px; border-radius: 8px; object-fit: contain; background: #000;">
                            </a>
                            <div style="font-size:0.75rem; text-align:right;">${data.file.name}</div>
                        </div>
                    `;
                } else {
                    contentHtml = `
                        <div class="bubble" style="display:flex; flex-direction:column; gap:6px;">
                            <span style="font-size:0.8rem; color:${isMine ? '#bae6fd' : '#8b949e'}">📁 파일이 공유되었습니다</span>
                            <a href="${url}" class="file-link" target="_blank" download="${data.file.name}">
                                💾 ${data.file.name}
                            </a>
                        </div>
                    `;
                }
            }

            el.innerHTML = `
                ${contentHtml}
                <div class="meta">
                    ${!isMine ? `<span>User-${data.senderId.substring(0, 4)}</span>` : ''}
                    <span>${time}</span>
                </div>
            `;

            msgContainer.appendChild(el);
            scrollToBottom();
        }

        function scrollToBottom() {
            msgContainer.scrollTop = msgContainer.scrollHeight;
        }

        // ─── 메시지 발송 ───
        function sendMessage() {
            const text = inputEl.value.trim();
            if (!text || ws.readyState !== WebSocket.OPEN) return;

            const payload = {
                senderId: myId,
                timestamp: Date.now(),
                type: 'text',
                text: text
            };

            // 명령어 파싱 (/open URL, /alert MSG)
            if (text.startsWith('/')) {
                payload.type = 'command';
                const parts = text.split(' ');
                payload.cmd = parts[0];
                payload.args = parts.slice(1).join(' ');
            }

            ws.send(JSON.stringify(payload));
            inputEl.value = '';
            inputEl.style.height = '44px'; // Reset height
            inputEl.focus();
        }

        // Enter 키 처리 (Shift+Enter는 줄바꿈)
        inputEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // 자동 리사이즈
        inputEl.addEventListener('input', function () {
            this.style.height = '44px';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });

        // ─── 메시지 수신 및 명령어 실행 ───
        function receiveMessage(data) {
            appendMessageBubble(data);

            // 본인 메시지는 명령어를 실행하지 않음 (본인이 보낸 시점에 실행되도록 할 수도 있으나, 여기선 수신 시 일괄 처리로 하되 다른 사람 명령어로 내 브라우저 제어)
            // 재미를 위해 "누가 보냈든" 명령어를 실행하도록 허용 (단, /open 등)
            if (data.type === 'command' && data.senderId !== myId) {
                executeCommand(data.cmd, data.args);
            }
        }

        function executeCommand(cmd, args) {
            if (cmd === '/open' && args) {
                // 특정 URL 열기
                let url = args;
                if (!url.startsWith('http')) url = 'https://' + url;
                window.open(url, '_blank');
            } else if (cmd === '/alert' && args) {
                // 알림 띄우기
                alert(`🚨 알림: ${args}`);
            }
        }

        // ─── 파일 업로드 ───
        const progOverlay = document.getElementById('progress-overlay');
        const progBar = document.getElementById('up-prog');

        async function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);

            progOverlay.style.display = 'flex';
            progBar.style.width = '0%';

            try {
                // XMLHttpRequest 로 프로그레스 바 구현
                const result = await new Promise((resolve, reject) => {
                    const xhr = new XMLHttpRequest();
                    xhr.upload.onprogress = e => {
                        if (e.lengthComputable) progBar.style.width = (e.loaded / e.total * 100) + '%';
                    };
                    xhr.onload = () => {
                        if (xhr.status < 300) resolve(JSON.parse(xhr.responseText));
                        else reject(new Error(xhr.responseText));
                    };
                    xhr.onerror = () => reject(new Error('네트워크 오류'));
                    xhr.open('POST', `/api/files`);
                    xhr.send(formData);
                });

                // 성공 시 WebSocket 으로 공유 알림
                if (ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        senderId: myId,
                        timestamp: Date.now(),
                        type: 'file',
                        file: {
                            id: result.fileId,
                            name: result.name,
                            size: result.size
                        }
                    }));
                }
            } catch (err) {
                alert('파일 업로드에 실패했습니다. ' + err.message);
            } finally {
                progOverlay.style.display = 'none';
                event.target.value = ''; // Reset input
            }
        }

    </script>
</body>

</html>
