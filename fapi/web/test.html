<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>간단한 테이블 예제</title>
    <style>
        .table-container {
            width: 100%;
            border: 1px solid #ccc;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 0;
        }
        thead th {
            background-color: #f4f4f4;
            position: sticky;
            top: 0;
            z-index: 2;
        }
        tbody {
            display: block;
            height: 70vh;
            overflow-y: auto;
            overflow-x: hidden;
            width: 100%;
        }
        thead, tbody tr {
            display: table;
            width: 100%;
            table-layout: fixed;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        tr:hover {
            background-color: #f5f5f5;
        }
    </style>
</head>
<body>
    <h2>샘플 테이블 (무한 스크롤)</h2>
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>번호</th>
                    <th>이름</th>
                    <th>직책</th>
                    <th>부서</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- 데이터가 JS로 동적으로 추가됩니다 -->
            </tbody>
        </table>
    </div>
    <script>
        // 샘플 데이터 생성
        const totalRows = 120;
        const pageSize = 30;
        let loadedRows = 0;
        const names = ["김철수", "이영희", "박지민", "정민수", "홍길동", "최수진", "한지훈", "오민아", "유재석", "강호동"];
        const positions = ["사원", "대리", "과장", "차장", "부장"];
        const departments = ["개발팀", "기획팀", "마케팅팀", "영업팀", "인사팀"];

        function getRandom(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function addRows(count) {
            const tbody = document.getElementById('tableBody');
            for (let i = loadedRows + 1; i <= Math.min(loadedRows + count, totalRows); i++) {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${i}</td>
                    <td>${getRandom(names)}</td>
                    <td>${getRandom(positions)}</td>
                    <td>${getRandom(departments)}</td>
                `;
                tbody.appendChild(tr);
            }
            loadedRows += count;
        }

        // 초기 로드
        addRows(pageSize);

        // 무한 스크롤 이벤트 (tbody 기준)
        const tbody = document.getElementById('tableBody');
        tbody.addEventListener('scroll', function() {
            if (tbody.scrollTop + tbody.clientHeight >= tbody.scrollHeight - 10) {
                if (loadedRows < totalRows) {
                    addRows(pageSize);
                }
            }
        });
    </script>
</body>
</html>
